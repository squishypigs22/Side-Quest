.log-list{display:grid;gap:9px}.log-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}.log-activity{display:flex;align-items:center;gap:10px;min-width:0}.log-activity .activity-icon{width:34px;height:34px}.log-activity strong{display:block;font-size:12px}.log-activity small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.log-actions{display:flex;gap:4px}.log-actions button{border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:8px;padding:7px 8px;font-size:10px;font-weight:650}.log-actions button[data-log-value="1"].active{background:#62d69b20;border-color:#62d69b80;color:var(--green)}.log-actions button[data-log-value="-1"].active{background:#e77a8318;border-color:#e77a8380;color:var(--red)}.log-actions button[data-log-value="0"].active{color:var(--text);border-color:#969ba580}.log-summary{padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:14px}.log-summary strong{font-size:19px}.log-summary small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.trick-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.trick-stat{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--surface)}.trick-stat strong{font-size:21px;display:block}.trick-stat small{font-size:10px;color:var(--muted)}.trick-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.trick-row{display:flex;align-items:center;gap:9px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}.trick-row .num{font-size:10px;color:var(--muted)}.trick-row strong{font-size:11px;flex:1;min-width:0}.trick-row select{max-width:108px;width:42%;font-size:10px;padding:6px;border:1px solid var(--line);border-radius:7px;background:var(--surface2);color:var(--text)}.file-input{display:none}
.bottom-nav{position:fixed;z-index:20;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#17191df5;border-top:1px solid var(--line);backdrop-filter:blur(12px)}.bottom-nav button{border:0;border-radius:9px;background:transparent;color:var(--muted);padding:7px 5px;font-size:10px;font-weight:650}.bottom-nav button.active{background:#8bbaff16;color:var(--accent)}.bottom-nav button[data-page="cat:fitness"].active{background:#72d6a51a;color:var(--fitness)}.bottom-nav button[data-page="cat:music"].active{background:#b69aff1a;color:var(--music)}.bottom-nav button[data-page="cat:skateboarding"].active{background:#ffb36b1a;color:var(--skate)}.bottom-nav button[data-page="Tricks"].active{background:#8bbaff16;color:var(--accent)}.bottom-nav button span{display:block;font-size:17px;line-height:1.2;margin-bottom:2px}.bottom-nav button span svg{width:21px;height:21px;vertical-align:middle}
.modal-backdrop{position:fixed;z-index:50;inset:0;display:grid;place-items:center;padding:20px;background:#0009}.modal{width:min(100%,330px);border:1px solid var(--line);border-radius:15px;background:#1a1d22;padding:18px;box-shadow:0 20px 70px #0008}.modal h2{margin-bottom:4px}.modal p{font-size:11px;color:var(--muted);margin:0 0 14px}.modal-actions{display:grid;gap:7px}.modal-actions button{border:1px solid var(--line);border-radius:9px;padding:11px;background:var(--surface2);color:var(--text);text-align:left;font-size:12px}.modal-actions button[data-value="1"]{border-color:#62d69b55}.modal-actions button[data-value="-1"]{border-color:#e77a8355}.modal-actions button[data-value="0"]{color:var(--muted)}.modal-close{float:right;border:0;background:transparent;color:var(--muted);font-size:20px}.toast{position:fixed;z-index:60;bottom:85px;left:50%;transform:translate(-50%,10px);opacity:0;pointer-events:none;background:#e7edf5;color:#111820;padding:9px 14px;border-radius:20px;font-size:11px;font-weight:700;transition:.18s}.toast.show{opacity:1;transform:translate(-50%,0)}.version-tag{position:fixed;right:11px;bottom:74px;z-index:25;color:#747b85;font-size:9px;letter-spacing:.3px;pointer-events:none}
@media(min-width:760px){.bottom-nav{left:50%;right:auto;transform:translateX(-50%);width:min(460px,calc(100% - 32px));border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0}.version-tag{bottom:12px}.toast{bottom:78px}}
@media(max-width:650px){.months-grid.current-month .month-card{padding:14px}.months-grid.current-month .month-days{gap:5px}.months-grid.current-month .date-cell,.months-grid.current-month .date-empty{min-height:36px}.app{padding:0 14px 110px}.topbar{height:60px;margin-bottom:23px}.page-head{margin-bottom:20px}.week-summary{gap:7px}.metric{padding:12px}.metric-value{font-size:23px}.activity-list{grid-template-columns:1fr}.months-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.month-card{padding:8px}.month-days,.weekdays{gap:2px}.date-cell{font-size:8px}.month-heading strong{font-size:10px}.trick-list{grid-template-columns:1fr}.version-tag{bottom:72px}}
@media(max-width:360px){.months-grid{grid-template-columns:1fr}.week-summary{grid-template-columns:repeat(3,minmax(0,1fr))}.metric-label{font-size:9px}}
</style>

<body>
<div class="app">
<header class="topbar"><div class="brand"><span class="brand-mark">SQ</span>Side Quest</div><div class="top-actions"><button class="icon-btn" id="exportBtn" aria-label="Export backup" title="Export backup">↓</button><button class="icon-btn" id="importBtn" aria-label="Import backup" title="Import backup">↑</button><input class="file-input" id="importFile" type="file" accept="application/json"></div></header>
<main id="view"></main>
</div>
<nav class="bottom-nav" id="bottomNav"></nav>
<div class="version-tag">v1.2.4</div>
<div class="toast" id="toast" role="status"></div>
<div id="modalRoot"></div>
<script>
(function(){
"use strict";
const categories=[
{id:"fitness",name:"Fitness",activities:["workout"]},
{id:"music",name:"Music",activities:["drums","guitar"]},
{id:"skateboarding",name:"Skateboarding",activities:["skate"]}
];
const A=[
{id:"workout",name:"Workouts",category:"fitness",icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6m4-9v12m8-12v12m4-9v6M2 12h20"/></svg>'},
{id:"drums",name:"Drums",category:"music",icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="7" rx="8" ry="3"/><path d="M4 7v10c0 1.7 3.6 3 8 3s8-1.3 8-3V7M4 13c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>'},
{id:"guitar",name:"Guitar",category:"music",icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4 20 2l2 2-2 6-3 3-4-1-4 4a3 3 0 1 1-4-4l4-4-1-4 2-2z"/><circle cx="7.5" cy="16.5" r="1"/></svg>'},
{id:"skate",name:"Skating",category:"skateboarding",icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15h18l-2 3H5zM6 18v2m12-2v2M8 11l2-3 3 2 3-4"/></svg>'}
];
const tricks=["Ollie","Fakie Ollie","Nollie","Switch Ollie","Shuvit","Pop Shuvit","Fakie Shuvit","Frontside 180","Backside 180","Fakie 180","Nollie 180","Kickflip","Heelflip","Fakie Kickflip","Fakie Heelflip","Varial Kickflip","Varial Heelflip","Hardflip","Inward Heelflip","Frontside Pop Shuvit","Backside Pop Shuvit","Bigspin","360 Shuvit","Fakie Bigspin","Frontside Bigspin","Backside Bigspin","Tre Flip","Laser Flip","360 Flip","Fakie 360 Flip","Nollie Kickflip","Nollie Heelflip","Switch Kickflip","Switch Heelflip","Frontside Flip","Backside Flip","Half Cab","Half Cab Flip","Half Cab Heelflip","No Comply","Boneless","Manual","Nose Manual","Boardslide","50-50 Grind","5-0 Grind","Smith Grind","Feeble Grind","Crooked Grind","Nosegrind"];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const monthKey=(y,m)=>y+"-"+String(m+1).padStart(2,"0"),key=(y,m,d)=>y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
const today=new Date(),todayKey=key(today.getFullYear(),today.getMonth(),today.getDate());
let data={};try{data=JSON.parse(localStorage.getItem("sq27")||"{}")||{}}catch(e){data={}}
data.activityDays=data.activityDays||{};data.tricks=data.tricks||{};data.targets=data.targets||{};data.startedMonth=data.startedMonth||monthKey(today.getFullYear(),today.getMonth());
let page="Overview",categoryId="",activityId="skate",viewYear=today.getFullYear(),showAllMonths=false;
function save(){localStorage.setItem("sq27",JSON.stringify(data))}
function getStatus(id,k){return Number(data.activityDays[id]?.[k]||0)}
function sessionCount(id,y,m){const prefix=monthKey(y,m)+"-";return Object.entries(data.activityDays[id]||{}).filter(([k,v])=>k.startsWith(prefix)&&v===1).length}
function totalSessions(id){return Object.values(data.activityDays[id]||{}).filter(v=>v===1).length}
function targetFor(id,y,m){
 const wanted=monthKey(y,m),base=Number(data.targets[id]?.base||8),start=data.startedMonth;
 if(wanted<start)return base;
 let [sy,sm]=start.split("-").map(Number);sm--;
 let value=base,guard=0;
 while((sy<y||(sy===y&&sm<m))&&guard++<180){
  const count=sessionCount(id,sy,sm);
  if(count>=value)value++;
  else value=Math.max(1,value-1);
  sm++;if(sm>11){sm=0;sy++;}
 }
 return value;
}
function countWeek(id,start,end){return Object.entries(data.activityDays[id]||{}).filter(([k,v])=>v===1&&k>=start&&k<=end).length}
function monday(d){let x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-(x.getDay()+6)%7);return x}
function dateKey(d){return key(d.getFullYear(),d.getMonth(),d.getDate())}
function weeklySummary(){
 const start=monday(today),end=new Date(start);end.setDate(end.getDate()+6);
 const prevStart=new Date(start);prevStart.setDate(prevStart.getDate()-7);
 const prevEnd=new Date(start);prevEnd.setDate(prevEnd.getDate()-1);
 let thisWeek=0,lastWeek=0,monthlyDone=0,monthlyTarget=0;
 A.forEach(a=>{
  thisWeek+=countWeek(a.id,dateKey(start),dateKey(end));
  lastWeek+=countWeek(a.id,dateKey(prevStart),dateKey(prevEnd));
  monthlyDone+=sessionCount(a.id,today.getFullYear(),today.getMonth());
  monthlyTarget+=targetFor(a.id,today.getFullYear(),today.getMonth());
 });
 const delta=thisWeek-lastWeek;
 const comparison=delta>0?"More":delta<0?"Fewer":"Same number of";
 const range=start.toLocaleDateString(undefined,{day:"numeric",month:"short"})+" – "+end.toLocaleDateString(undefined,{day:"numeric",month:"short"});
 return '<section class="section"><div class="section-head"><h2>This week</h2><small>'+range+'</small></div>'+
 '<div class="week-summary">'+
 '<div class="metric"><div class="metric-label">Sessions this week</div><div class="metric-value">'+thisWeek+'</div><div class="metric-note">Across all activities</div></div>'+
 '<div class="metric"><div class="metric-label">Monthly targets</div><div class="metric-value">'+monthlyDone+' / '+monthlyTarget+'</div><div class="metric-note">Sessions logged this month</div></div>'+
 '<div class="metric"><div class="metric-label">Vs previous week</div><div class="metric-value">'+(delta>0?"+":"")+delta+'</div><div class="metric-note">'+comparison+' sessions</div></div>'+
 '</div></section>';
}
function activityCard(a){
 const done=totalSessions(a.id),target=targetFor(a.id,today.getFullYear(),today.getMonth()),month=sessionCount(a.id,today.getFullYear(),today.getMonth());
 return '<button class="activity-row" data-category="'+a.category+'" data-open-activity="'+a.id+'"><span class="activity-icon">'+a.icon+'</span><span class="activity-copy"><span class="activity-name">'+a.name+'</span><span class="activity-meta">'+month+' / '+target+' this month · '+done+' total sessions</span></span><span class="activity-total">›</span></button>';
}
function categorySummary(c){
 const list=c.activities.map(id=>A.find(a=>a.id===id)),sum=list.reduce((n,a)=>n+sessionCount(a.id,today.getFullYear(),today.getMonth()),0),target=list.reduce((n,a)=>n+targetFor(a.id,today.getFullYear(),today.getMonth()),0);
 return '<div class="category-block cat-'+c.id+'"><div class="category-top"><span class="category-title">'+c.name+'</span><span class="category-meta">'+sum+' / '+target+' sessions this month</span></div><div class="activity-list">'+list.map(activityCard).join("")+'</div></div>';
}
function dashboard(){
 return '<div class="page-head"><div class="eyebrow">PERSONAL TRACKER · '+today.getFullYear()+'</div><h1>Overview</h1><p>Your progress, at a glance.</p></div>'+weeklySummary()+'<section class="section"><div class="section-head"><h2>Your categories</h2><small>Open a category to explore</small></div>'+categories.map(categorySummary).join("")+'</section>';
}
function categoriesPage(){
 return '<div class="page-head"><div class="eyebrow">YOUR TRACKING</div><h1>Categories</h1><p>Choose an area to view its activities.</p></div>'+categories.map(c=>{
 const list=c.activities.map(id=>A.find(a=>a.id===id)),n=list.reduce((s,a)=>s+sessionCount(a.id,today.getFullYear(),today.getMonth()),0),t=list.reduce((s,a)=>s+targetFor(a.id,today.getFullYear(),today.getMonth()),0);
 return '<button class="category-link" data-open-category="'+c.id+'"><span><strong>'+c.name+'</strong><small>'+list.map(a=>a.name).join(" · ")+' · '+n+' / '+t+' sessions this month</small></span><span class="arrow">›</span></button>';
 }).join("");
}
function categoryPage(){
 const c=categories.find(x=>x.id===categoryId);if(!c)return categoriesPage();
 if(c.activities.length===1){activityId=c.activities[0];page="Activity";return activityPage()}
 const list=c.activities.map(id=>A.find(a=>a.id===id));
 return '<div class="page-head category-page-head cat-'+c.id+'"><div class="eyebrow"><button class="quiet-btn" data-page="Overview">‹ Overview</button></div><h1>'+c.name+'</h1><p>'+list.length+' activities</p></div><div class="activity-list">'+list.map(activityCard).join("")+'</div>';
}
function monthCard(id,y,m){
 const count=sessionCount(id,y,m),target=targetFor(id,y,m),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),parts=[];
 for(let i=0;i<first;i++)parts.push('<span class="date-empty"></span>');
 for(let d=1;d<=days;d++){
  const k=key(y,m,d),v=getStatus(id,k),future=k>todayKey;
  parts.push('<button class="date-cell '+(v===1?"done":v===-1?"missed":"")+' '+(k===todayKey?"today":"")+'" data-date="'+k+'" '+(future?"disabled":"")+' aria-label="'+k+' '+(v===1?"completed":v===-1?"missed":"unmarked")+'">'+d+'</button>');
 }
 return '<section class="month-card"><div class="month-heading"><strong>'+new Date(y,m,1).toLocaleDateString(undefined,{month:"short"})+'</strong><small>'+count+'/'+target+'</small></div><div class="weekdays"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div><div class="month-days">'+parts.join("")+'</div><div class="month-foot">sessions / target</div></section>';
}
function activityPage(){
 const a=A.find(x=>x.id===activityId);if(!a)return categoriesPage();
 const count=sessionCount(a.id,today.getFullYear(),today.getMonth()),target=targetFor(a.id,today.getFullYear(),today.getMonth()),pct=Math.min(100,Math.round(count/target*100));
 const displayMonth=viewYear===today.getFullYear()?today.getMonth():0;const months=showAllMonths?Array.from({length:12},(_,m)=>monthCard(a.id,viewYear,m)).join(""):monthCard(a.id,viewYear,displayMonth);
 const musicSwitch=a.category==="music"?'<div class="music-switch" role="group" aria-label="Music activity"><button data-music-activity="drums" class="'+(a.id==="drums"?"active":"")+'" aria-pressed="'+(a.id==="drums")+'">Drums</button><button data-music-activity="guitar" class="'+(a.id==="guitar"?"active":"")+'" aria-pressed="'+(a.id==="guitar")+'">Guitar</button></div>':"";
 return '<div class="page-head activity-page-head cat-'+a.category+'"><div class="eyebrow"><button class="quiet-btn" data-page="Overview">‹ Overview</button></div><h1>'+a.name+'</h1><p>Yearly activity calendar</p></div>'+musicSwitch+'<section class="target-panel"><div><div class="target-title">Monthly target · '+today.toLocaleDateString(undefined,{month:"long"})+'</div><div class="target-number">'+count+' <span style="font-size:13px;color:var(--muted);font-weight:500">/ '+target+' sessions</span></div></div><div class="target-side"><strong>'+pct+'%</strong><small>of target</small></div><div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div><div class="target-caption"><span>'+(count>=target?"Target reached":target-count+" to go")+'</span><span>'+(count>=target?"Next month target +1": "Target adjusts by one session each month")+'</span></div></section><div class="year-nav"><button data-year="-1" aria-label="Previous year" '+(viewYear<=2026?"disabled":"")+'>‹</button><strong>'+viewYear+'</strong><button data-year="1" aria-label="Next year" '+(viewYear>=today.getFullYear()?"disabled":"") +'>›</button><button class="quiet-btn" data-toggle-months>'+(showAllMonths?"Show current month":"View all") +'</button></div><div class="months-grid '+(showAllMonths?"":"current-month")+'">'+months+'</div><p class="muted" style="font-size:10px;margin-top:12px">Tap any past or present day to mark it completed, missed or clear it. Unmarked days stay blank.</p>';
}
function logPage(){
 const done=A.filter(a=>getStatus(a.id,todayKey)===1).length;
 const missed=A.filter(a=>getStatus(a.id,todayKey)===-1).length;
 const dateLabel=today.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
 return '<div class="page-head"><div class="eyebrow">DAILY CHECK-IN</div><h1>Log</h1><p>'+dateLabel+'</p></div><div class="log-summary"><strong>'+done+' / '+A.length+'</strong><small>activities completed today · '+missed+' marked missed</small></div><div class="log-list">'+A.map(a=>{
  const status=getStatus(a.id,todayKey);
  const tone=a.category==="fitness"?"fitness":a.category==="music"?"music":"skate";
  return '<section class="log-row"><div class="log-activity"><span class="activity-icon" style="color:var(--'+tone+')">'+a.icon+'</span><span><strong>'+a.name+'</strong><small>'+(status===1?"Completed":status===-1?"Missed":"Not logged")+'</small></span></div><div class="log-actions"><button data-log-activity="'+a.id+'" data-log-value="1" class="'+(status===1?"active":"")+'" aria-pressed="'+(status===1)+'">Done</button><button data-log-activity="'+a.id+'" data-log-value="-1" class="'+(status===-1?"active":"")+'" aria-pressed="'+(status===-1)+'">Missed</button><button data-log-activity="'+a.id+'" data-log-value="0" class="'+(status===0?"active":"")+'" aria-pressed="'+(status===0)+'">Clear</button></div></section>';
 }).join("")+'</div>';
}
function tricksPage(){
 const learnt=tricks.filter(t=>(data.tricks[t]||"Not learnt")==="Learnt").length,learning=tricks.filter(t=>data.tricks[t]==="Learning").length;
 return '<div class="page-head"><div class="eyebrow">SKATEBOARDING</div><h1>Tricks</h1><p>Track what you have learnt.</p></div><div class="trick-summary"><div class="trick-stat"><strong>'+learnt+'</strong><small>Learnt</small></div><div class="trick-stat"><strong>'+learning+'</strong><small>Learning</small></div><div class="trick-stat"><strong>'+(50-learnt-learning)+'</strong><small>Not learnt</small></div></div><div class="trick-list">'+tricks.map((t,i)=>'<div class="trick-row"><span class="num">'+String(i+1).padStart(2,"0")+'</span><strong>'+esc(t)+'</strong><select data-trick="'+esc(t)+'"><option '+((data.tricks[t]||"Not learnt")==="Not learnt"?"selected":"")+'>Not learnt</option><option '+(data.tricks[t]==="Learning"?"selected":"")+'>Learning</option><option '+(data.tricks[t]==="Learnt"?"selected":"")+'>Learnt</option></select></div>').join("")+'</div>';
}
function render(){
 const labels=[["Overview","⌂","Overview"],["Fitness","✳","cat:fitness"],["Music","♫","cat:music"],["Skate",'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14.5h18l-1.8 2.2H4.8z"/><circle cx="7" cy="19" r="1.2"/><circle cx="17" cy="19" r="1.2"/></svg>',"cat:skateboarding"],["Log","+","Log"],["Tricks","↗","Tricks"]];
 $("bottomNav").innerHTML=labels.map(([name,icon,target])=>'<button data-page="'+target+'" class="'+((page===target||(target.startsWith("cat:")&&page==="Activity"&&A.find(a=>a.id===activityId)?.category===target.slice(4)))?"active":"")+'"><span>'+icon+'</span>'+name+'</button>').join("");
 $("view").innerHTML=page==="Overview"?dashboard():page==="Category"?categoryPage():page==="Activity"?activityPage():page==="Log"?logPage():page==="Tricks"?tricksPage():dashboard();
}
function toast(message){const t=$("toast");t.textContent=message;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500)}
function openModal(date){
 const current=getStatus(activityId,date);
 $("modalRoot").innerHTML='<div class="modal-backdrop" data-close-modal><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button class="modal-close" data-close-modal aria-label="Close">×</button><h2 id="modalTitle">'+new Date(date+"T12:00:00").toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long",year:"numeric"})+'</h2><p>Choose how to record this day.</p><div class="modal-actions"><button data-value="1">✓ &nbsp; Completed</button><button data-value="-1">− &nbsp; Missed</button><button data-value="0">Clear entry</button></div></section></div>';
 $("modalRoot").querySelectorAll("[data-value]").forEach(btn=>btn.addEventListener("click",()=>{
  data.activityDays[activityId]=data.activityDays[activityId]||{};
  if(Number(btn.dataset.value)===0)delete data.activityDays[activityId][date];else data.activityDays[activityId][date]=Number(btn.dataset.value);
  save();$("modalRoot").innerHTML="";render();
 }));
}
document.addEventListener("click",e=>{
 const close=e.target.closest("[data-close-modal]");if(close){$("modalRoot").innerHTML="";return}
 const quickLog=e.target.closest("[data-log-activity]");if(quickLog){const id=quickLog.dataset.logActivity,value=Number(quickLog.dataset.logValue);data.activityDays[id]=data.activityDays[id]||{};if(value===0)delete data.activityDays[id][todayKey];else data.activityDays[id][todayKey]=value;save();render();return}
 const music=e.target.closest("[data-music-activity]");if(music){activityId=music.dataset.musicActivity;categoryId="music";viewYear=today.getFullYear();page="Activity";render();return}
 const p=e.target.closest("[data-page]");if(p){const target=p.dataset.page;if(target.startsWith("cat:")){categoryId=target.slice(4);const c=categories.find(x=>x.id===categoryId);activityId=categoryId==="music"?"drums":c.activities[0];page="Activity"}else{page=target}render();window.scrollTo(0,0);return}
 const c=e.target.closest("[data-open-category]");if(c){categoryId=c.dataset.openCategory;const cat=categories.find(x=>x.id===categoryId);activityId=categoryId==="music"?"drums":cat.activities[0];page="Activity";viewYear=today.getFullYear();render();window.scrollTo(0,0);return}
 const a=e.target.closest("[data-open-activity]");if(a){activityId=a.dataset.openActivity;viewYear=today.getFullYear();page="Activity";render();window.scrollTo(0,0);return}
 const date=e.target.closest("[data-date]");if(date&&!date.disabled){openModal(date.dataset.date);return}
 const toggle=e.target.closest("[data-toggle-months]");if(toggle){showAllMonths=!showAllMonths;render();return}
 const y=e.target.closest("[data-year]");if(y){viewYear=Math.max(2026,Math.min(today.getFullYear(),viewYear+Number(y.dataset.year)));showAllMonths=false;render()}
});
document.addEventListener("change",e=>{
 const s=e.target.closest("[data-trick]");if(s){data.tricks[s.dataset.trick]=s.value;save();render()}
});
$("exportBtn").addEventListener("click",()=>{const blob=new Blob([JSON.stringify({version:3,data},null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="side-quest-backup.json";a.click();URL.revokeObjectURL(url);toast("Backup exported")});
$("importBtn").addEventListener("click",()=>$("importFile").click());
$("importFile").addEventListener("change",async e=>{
 const file=e.target.files[0];if(!file)return;
 try{const parsed=JSON.parse(await file.text()),incoming=parsed.data||parsed;if(!incoming||typeof incoming!=="object"||!confirm("Restore this backup and replace your current progress?"))return;data.activityDays=incoming.activityDays||{};data.tricks=incoming.tricks||{};data.targets=incoming.targets||data.targets;data.startedMonth=incoming.startedMonth||data.startedMonth;save();render();toast("Backup restored")}catch(err){alert("That file is not a valid Side Quest backup.")}e.target.value="";
});
render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{});
})();
</script>
</body>
</html>
