<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171326">
<meta name="description" content="Side Quest — track the days you show up.">
<link rel="manifest" href="manifest.webmanifest">
<title>Side Quest — 2027</title>
<style>
:root{color-scheme:dark;--bg:#171326;--panel:#211c35;--panel2:#2a2442;--line:#393251;--text:#fffaff;--muted:#b8b0ca;--pink:#ff6f91;--purple:#a98bff;--blue:#69c9ff;--orange:#ffb45f;--green:#55df9a;--red:#ff667e;--radius:19px}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -10%,#553b7850,transparent 38%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid var(--purple);outline-offset:3px}
.app{min-height:100vh;max-width:1250px;margin:auto;padding:0 34px 100px}.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff12;margin-bottom:30px}.brand{display:flex;align-items:center;gap:10px;font-weight:850;font-size:20px;letter-spacing:-.8px}.brand-mark{width:35px;height:35px;border-radius:12px;background:linear-gradient(135deg,var(--pink),var(--purple));display:grid;place-items:center;color:#21162d;font-size:20px}.brand span{color:var(--pink)}.top-actions{display:flex;gap:8px}.icon-btn,.secondary{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:11px;padding:9px 12px}.icon-btn{width:39px;height:39px;padding:0;font-size:18px}.icon-btn:hover,.secondary:hover{border-color:var(--purple)}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--pink);font-weight:800}.page-head h1{font-size:clamp(29px,5vw,42px);letter-spacing:-1.8px;line-height:1.08;margin:5px 0}.page-head p{color:var(--muted);font-size:13px;margin:7px 0 0}.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}.tab{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:12px;padding:9px 14px;font-size:12px;font-weight:700}.tab.active{background:#a98bff24;border-color:var(--purple);color:#e5d9ff}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}.card{background:linear-gradient(145deg,#28223e,#201b32);border:1px solid var(--line);border-radius:var(--radius);padding:19px;min-width:0}.stat-label{font-size:10px;color:var(--muted);letter-spacing:.7px;font-weight:750}.stat-value{font-size:30px;font-weight:850;letter-spacing:-1px;margin-top:4px}.stat-note{font-size:11px;color:var(--muted)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.section-head h2{font-size:15px;margin:0;letter-spacing:-.3px}.section-head small{color:var(--muted);font-size:11px}.activity-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.activity-card{display:flex;align-items:center;gap:13px;padding:15px;border-radius:15px;border:1px solid var(--line);background:var(--panel);text-align:left;color:var(--text);width:100%}.activity-card:active{transform:scale(.985)}.activity-emoji{width:43px;height:43px;display:grid;place-items:center;border-radius:14px;font-size:22px;flex-shrink:0}.activity-card:nth-child(1) .activity-emoji{background:#ff6f9125}.activity-card:nth-child(2) .activity-emoji{background:#a98bff25}.activity-card:nth-child(3) .activity-emoji{background:#69c9ff25}.activity-card:nth-child(4) .activity-emoji{background:#ffb45f25}.activity-name{font-weight:800;font-size:14px}.activity-sub{font-size:11px;color:var(--muted);margin-top:2px}.activity-check{margin-left:auto;font-size:20px;color:var(--muted)}.activity-card.done{border-color:#55df9a80;background:#55df9a0d}.activity-card.done .activity-check{color:var(--green)}
.calendar-card{padding:18px}.monthbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.monthbar strong{font-size:16px}.month-actions{display:flex;gap:7px}.month-actions button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text)}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekday{text-align:center;color:var(--muted);font-size:10px;font-weight:750;padding:5px 0}.day{min-height:70px;border:1px solid #ffffff12;background:#ffffff05;border-radius:11px;padding:7px 4px;display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--text)}.day.empty{background:transparent;border-color:transparent}.day.selected{border:1px solid var(--purple);background:#a98bff20}.day.today .day-num{color:var(--pink);font-weight:900}.day-num{font-size:12px;font-weight:700}.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}.dot{width:7px;height:7px;border-radius:50%;background:#514a63}.dot.on{background:var(--green);box-shadow:0 0 7px #55df9a55}.dot.off{background:var(--red);opacity:.9}.dot.future{background:#514a63}.legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:10px}.legend span{display:flex;align-items:center;gap:5px}.legend .dot{width:8px;height:8px}.day-detail{margin-top:17px;padding-top:16px;border-top:1px solid var(--line)}.day-detail h3{font-size:14px;margin:0 0 12px}.toggle-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.toggle-row{display:flex;align-items:center;gap:9px;padding:10px;border-radius:11px;background:#ffffff08;border:1px solid #ffffff12;font-size:12px}.toggle-row input{accent-color:var(--green);width:17px;height:17px}.trick-list{display:grid;gap:7px}.trick-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#ffffff07;border:1px solid #ffffff12}.trick-number{width:25px;color:#938aa9;font-size:11px;font-weight:800}.trick-name{flex:1;font-size:12px;font-weight:650}.trick-status{background:#332d49;color:var(--muted);border:1px solid #4b4265;border-radius:9px;padding:7px 8px;font-size:11px;max-width:125px}.trick-status[data-status="Learning"]{color:var(--orange);border-color:#ffb45f66}.trick-status[data-status="Learnt"]{color:var(--green);border-color:#55df9a66}.filterbar{display:flex;gap:7px;flex-wrap:wrap}.filterbar button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:6px 11px;font-size:11px}.filterbar button.active{background:#a98bff20;border-color:var(--purple);color:#e6ddff}.progress-track{height:8px;background:#49415d;border-radius:20px;overflow:hidden;margin-top:9px}.progress-fill{height:100%;background:linear-gradient(90deg,var(--pink),var(--purple),var(--blue));border-radius:20px}.bottom-nav{display:none}.file-input{display:none}.toast{position:fixed;bottom:25px;left:50%;transform:translate(-50%,15px);opacity:0;background:var(--purple);color:#1b1530;padding:10px 16px;border-radius:30px;font-size:12px;font-weight:800;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){.app{padding:0 15px 95px}.topbar{height:62px;margin-bottom:22px}.brand{font-size:18px}.brand-mark{width:31px;height:31px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat-value{font-size:25px}.card{padding:14px;border-radius:16px}.activity-grid{gap:9px}.activity-card{padding:11px;gap:9px}.activity-emoji{width:37px;height:37px;font-size:19px}.activity-name{font-size:12px}.activity-sub{font-size:10px}.activity-check{font-size:17px}.day{min-height:57px;padding:6px 2px;gap:6px;border-radius:9px}.calendar-grid{gap:3px}.dot{width:6px;height:6px}.weekday{font-size:9px}.day-num{font-size:11px}.calendar-card{padding:12px}.toggle-list{grid-template-columns:1fr}.trick-row{padding:9px}.trick-status{max-width:112px}.bottom-nav{position:fixed;display:grid;z-index:10;bottom:0;left:0;right:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom));grid-template-columns:repeat(3,1fr);background:#1b172bf5;border-top:1px solid var(--line);gap:5px}.bottom-nav button{background:transparent;border:0;color:var(--muted);padding:7px;border-radius:10px;font-size:11px;font-weight:750}.bottom-nav button.active{background:#a98bff24;color:#e6ddff}.page-head{margin-bottom:16px}.page-head p{font-size:12px}.tabs{margin-bottom:14px}.toast{bottom:85px}}
@media(max-width:380px){.app{padding-left:10px;padding-right:10px}.day{min-height:51px}.dot{width:5px;height:5px}.activity-card{gap:7px}.activity-emoji{width:32px;height:32px}.activity-name{font-size:11px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="brand"><div class="brand-mark">✦</div>Side <span>Quest</span></div><div class="top-actions"><button class="icon-btn" id="exportBtn" title="Export backup" aria-label="Export backup">↓</button><button class="icon-btn" id="importBtn" title="Import backup" aria-label="Import backup">↑</button><input class="file-input" id="importFile" type="file" accept="application/json"></div></header>
<div id="view"></div>
</div>
<nav class="bottom-nav" id="mobileNav"></nav><div class="toast" id="toast" role="status"></div>
<script>
(function(){
const activities=[{id:"skate",name:"Skating",icon:"🛹",colour:"pink"},{id:"drums",name:"Drums",icon:"🥁",colour:"purple"},{id:"guitar",name:"Guitar",icon:"🎸",colour:"blue"},{id:"workout",name:"Workouts",icon:"💪",colour:"orange"}];
const tricks=["Ollie","Shuvit","Frontside 180","Backside 180","Pop Shuvit","Fakie Ollie","Nollie","Kickflip","Heelflip","Fakie Shuvit","Frontside Shuvit","Backside Shuvit","Varial Kickflip","Varial Heelflip","Fakie Kickflip","Fakie Heelflip","Nollie Shuvit","Frontside 360","Backside 360","Manual","Nose Manual","50-50 Grind","Boardslide","Noseslide","Tailslide","5-0 Grind","Smith Grind","Feeble Grind","Crooked Grind","Bluntslide","Kickflip Manual","Ollie North","Boneless","No Comply","Impossible","Hardflip","Inward Heelflip","360 Flip","Laser Flip","Bigspin","Frontside Bigspin","Backside Bigspin","Tre Flip","Nollie Kickflip","Nollie Heelflip","Nollie 360 Shuvit","Fakie Bigspin","Caballerial","Frontside Boardslide","Backside Boardslide"];
const $=id=>document.getElementById(id);
const todayKey=()=>{const d=new Date();return key(d)};
const key=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parse=k=>new Date(k+"T12:00:00");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let data={days:{},tricks:{}};
try{const old=JSON.parse(localStorage.getItem("sq27")||"{}");if(old&&typeof old==="object"){data.days=old.days&&typeof old.days==="object"?old.days:{};data.tricks=old.tricks&&typeof old.tricks==="object"?old.tricks:{}}}catch(e){}
let page="Overview",month=new Date(new Date().getFullYear(),new Date().getMonth(),1),selected=todayKey(),filter="All";
function save(){localStorage.setItem("sq27",JSON.stringify(data))}
function done(day,id){return !!(data.days[day]&&data.days[day][id])}
function setDone(day,id,value){if(!data.days[day])data.days[day]={};data.days[day][id]=value;save();render()}
function monthTitle(d){return d.toLocaleDateString(undefined,{month:"long",year:"numeric"})}
function dayTitle(k){return parse(k).toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"})}
function monthCalendar(){const first=new Date(month.getFullYear(),month.getMonth(),1),offset=(first.getDay()+6)%7,total=new Date(month.getFullYear(),month.getMonth()+1,0).getDate();let cells="";for(let i=0;i<offset;i++)cells+='<div class="day empty"></div>';for(let n=1;n<=total;n++){const d=new Date(month.getFullYear(),month.getMonth(),n),k=key(d),future=k>todayKey(),dots=activities.map(a=>'<i class="dot '+(done(k,a.id)?"on":future?"future":"off")+'"></i>').join("");cells+='<button class="day '+(selected===k?"selected ":"")+(k===todayKey()?"today":"")+'" data-day="'+k+'"><span class="day-num">'+n+'</span><span class="dots">'+dots+'</span></button>'}return '<div class="calendar-card card"><div class="monthbar"><strong>'+monthTitle(month)+'</strong><div class="month-actions"><button data-month="-1" aria-label="Previous month">‹</button><button data-month="1" aria-label="Next month">›</button></div></div><div class="calendar-grid">'+["M","T","W","T","F","S","S"].map(x=>'<div class="weekday">'+x+'</div>').join("")+cells+'</div><div class="legend"><span><i class="dot on"></i> Done</span><span><i class="dot off"></i> Not done</span><span><i class="dot future"></i> Future</span></div><div class="day-detail"><h3>'+dayTitle(selected)+'</h3><div class="toggle-list">'+activities.map(a=>'<label class="toggle-row"><input type="checkbox" data-activity="'+a.id+'" '+(done(selected,a.id)?"checked":"")+'><span>'+a.icon+' '+a.name+'</span><strong style="margin-left:auto;color:'+(done(selected,a.id)?"var(--green)":"var(--muted)")+'">'+(done(selected,a.id)?"Done":"Not done")+'</strong></label>').join("")+'</div></div></div>'}
function activityCards(){return '<div class="grid activity-grid">'+activities.map(a=>'<button class="activity-card '+(done(todayKey(),a.id)?"done":"")+'" data-today="'+a.id+'"><span class="activity-emoji">'+a.icon+'</span><span><span class="activity-name">'+a.name+'</span><br><span class="activity-sub">'+(done(todayKey(),a.id)?"Logged today":"Tap when you do it")+'</span></span><span class="activity-check">'+(done(todayKey(),a.id)?"●":"○")+'</span></button>').join("")+'</div>'}
function countFor(id){return Object.keys(data.days).filter(k=>data.days[k]&&data.days[k][id]).length}
function overview(){const total=activities.reduce((n,a)=>n+countFor(a.id),0),trickCount=Object.values(data.tricks).filter(s=>s==="Learnt").length;return '<div class="page-head"><div><div class="eyebrow">Your year, your pace</div><h1>Show up. Level up.</h1><p>Tap to track the things you actually do. No diary, no essays.</p></div></div><div class="grid stats">'+activities.map(a=>'<div class="card"><div class="stat-label">'+a.icon+' '+a.name.toUpperCase()+'</div><div class="stat-value">'+countFor(a.id)+'</div><div class="stat-note">days logged</div></div>').join("")+'</div><section class="card" style="margin-bottom:14px"><div class="section-head"><h2>Today</h2><small>'+dayTitle(todayKey())+'</small></div>'+activityCards()+'</section><section class="card"><div class="section-head"><h2>Your progress</h2><small>'+total+' activity days · '+trickCount+'/50 tricks learnt</small></div><div class="progress-track"><div class="progress-fill" style="width:'+Math.round(trickCount/50*100)+'%"></div></div><div style="display:flex;justify-content:space-between;gap:10px;margin-top:15px"><button class="secondary" data-page="Calendar">Open day map →</button><button class="secondary" data-page="Tricks">Skate trick list →</button></div></section>'}
function calendarPage(){return '<div class="page-head"><div><div class="eyebrow">Your activity map</div><h1>Every day counts.</h1><p>Four dots per day. Green means you did it; red means you didn’t.</p></div></div>'+monthCalendar()}
function tricksPage(){const learnt=tricks.filter(t=>data.tricks[t]==="Learnt").length,learning=tricks.filter(t=>data.tricks[t]==="Learning").length;const shown=tricks.map((t,i)=>({t,i})).filter(x=>filter==="All"||((data.tricks[x.t]||"Not learnt")===filter));return '<div class="page-head"><div><div class="eyebrow">Skate progression</div><h1>Trick list.</h1><p>50 tricks. Start anywhere and update each one as you progress.</p></div></div><div class="grid stats"><div class="card"><div class="stat-label">LEARNT</div><div class="stat-value">'+learnt+'</div></div><div class="card"><div class="stat-label">LEARNING</div><div class="stat-value">'+learning+'</div></div><div class="card"><div class="stat-label">NOT LEARNT</div><div class="stat-value">'+(50-learnt-learning)+'</div></div><div class="card"><div class="stat-label">COMPLETION</div><div class="stat-value">'+Math.round(learnt/50*100)+'%</div></div></div><section class="card"><div class="section-head"><h2>Tricks</h2><small>'+shown.length+' shown</small></div><div class="filterbar">'+["All","Not learnt","Learning","Learnt"].map(f=>'<button data-filter="'+f+'" class="'+(filter===f?"active":"")+'">'+f+'</button>').join("")+'</div><div class="trick-list" style="margin-top:13px">'+shown.map(x=>{const s=data.tricks[x.t]||"Not learnt";return '<div class="trick-row"><span class="trick-number">'+String(x.i+1).padStart(2,"0")+'</span><span class="trick-name">'+esc(x.t)+'</span><select class="trick-status" data-trick="'+esc(x.t)+'" data-status="'+s+'"><option '+(s==="Not learnt"?"selected":"")+'>Not learnt</option><option '+(s==="Learning"?"selected":"")+'>Learning</option><option '+(s==="Learnt"?"selected":"")+'>Learnt</option></select></div>'}).join("")+'</div></section>'}
function render(){const tabs=[["Overview","Home"],["Calendar","Day map"],["Tricks","Tricks"]];$("mobileNav").innerHTML=tabs.map(([p,l])=>'<button data-page="'+p+'" class="'+(page===p?"active":"")+'">'+l+'</button>').join("");$("view").innerHTML=page==="Overview"?overview():page==="Calendar"?calendarPage():tricksPage()}
document.addEventListener("click",e=>{const p=e.target.closest("[data-page]");if(p){page=p.dataset.page;render();window.scrollTo({top:0,behavior:"smooth"});return}const t=e.target.closest("[data-today]");if(t){setDone(todayKey(),t.dataset.today,!done(todayKey(),t.dataset.today));return}const d=e.target.closest("[data-day]");if(d){selected=d.dataset.day;render();return}const m=e.target.closest("[data-month]");if(m){month=new Date(month.getFullYear(),month.getMonth()+Number(m.dataset.month),1);selected=key(month);render();return}const f=e.target.closest("[data-filter]");if(f){filter=f.dataset.filter;render()}});
document.addEventListener("change",e=>{if(e.target.matches("[data-activity]"))setDone(selected,e.target.dataset.activity,e.target.checked);if(e.target.matches("[data-trick]")){data.tricks[e.target.dataset.trick]=e.target.value;save();render()}});
function notify(s){const t=$("toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800)}
$("exportBtn").addEventListener("click",()=>{const blob=new Blob([JSON.stringify({version:2,exported:new Date().toISOString(),data},null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="side-quest-backup-"+todayKey()+".json";a.click();URL.revokeObjectURL(url);notify("Backup exported")});
$("importBtn").addEventListener("click",()=>$("importFile").click());
$("importFile").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;try{const parsed=JSON.parse(await f.text()),incoming=parsed.data||parsed;if(!incoming.days||!incoming.tricks)throw new Error();if(!confirm("Replace your current tracking data with this backup?"))return;data=incoming;save();render();notify("Backup restored")}catch(err){alert("That file isn't a valid Side Quest backup.")}e.target.value=""});
render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{});
})();
</script>
</body>
</html>
