<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10120d"><link rel="manifest" href="manifest.webmanifest"><title>Side Quest — 2027</title>
<style>
:root{color-scheme:dark;--bg:#0c0e0b;--panel:#151813;--line:#292d25;--muted:#92988a;--lime:#c6f36b;--text:#f1f3ec}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}header{padding:25px 20px 18px;max-width:900px;margin:auto;display:flex;justify-content:space-between;align-items:center}h1{font-size:25px;margin:0;letter-spacing:-1px}h1 span{color:var(--lime)}.year{color:var(--muted);font-size:12px}main{max-width:900px;margin:auto;padding:0 16px 40px}.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 15px}.tabs button{white-space:nowrap;background:none;border:1px solid var(--line);color:var(--muted);padding:10px 14px;border-radius:10px}.tabs button.active{background:var(--lime);border-color:var(--lime);color:#151910;font-weight:700}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin:10px 0}.eyebrow{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1.5px}.big{font-size:34px;font-weight:750;letter-spacing:-1px;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat{padding:14px;background:#1c2019;border-radius:12px}.stat b{display:block;font-size:23px;margin:5px 0}.muted{color:var(--muted)}input,textarea,select{width:100%;background:#0e100d;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px;font:inherit;margin:6px 0}button,.action{cursor:pointer}.primary{background:var(--lime);color:#151910;border:0;border-radius:9px;padding:11px 15px;font-weight:700}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.check{accent-color:var(--lime);width:18px;height:18px}.progress{height:8px;background:#30352b;border-radius:20px;overflow:hidden;margin:10px 0}.progress div{height:100%;background:var(--lime);width:0}.hide{display:none}footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
</style></head><body><header><div><h1>Side <span>Quest.</span></h1><div class="year">YOUR 2027, IN PROGRESS</div></div><div class="year">PERSONAL DASHBOARD</div></header><main><nav class="tabs" id="tabs"></nav><section id="view"></section><footer>Small steps count. Your data stays on this device.</footer></main>
<script>
const sections=["Overview","Daily Log","Music","Skate","Wellbeing","College","Work & Money","Weekly Review"];
let current="Overview", data=JSON.parse(localStorage.sq27||'{"logs":[],"goals":[]}');
const save=()=>localStorage.sq27=JSON.stringify(data);
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function nav(){tabs.innerHTML=sections.map(s=>'<button class="'+(s===current?'active':'')+'" onclick="current=\''+s+'\';render()">'+s+'</button>').join('')}
function render(){nav();let v=document.getElementById("view");
if(current==="Overview"){let count=data.logs.length;v.innerHTML='<div class="panel"><div class="eyebrow">THE BIG PICTURE</div><div class="big">Make 2027 <span style="color:var(--lime)">count.</span></div><p class="muted">Show up, track the effort, and keep moving.</p><div class="grid"><div class="stat"><span class="muted">Entries logged</span><b>'+count+'</b></div><div class="stat"><span class="muted">This week</span><b>'+data.logs.filter(x=>Date.now()-new Date(x.date)<604800000).length+'</b></div><div class="stat"><span class="muted">Goals</span><b>'+data.goals.filter(x=>x.done).length+' / '+data.goals.length+'</b></div></div><div class="panel"><div class="eyebrow">YOUR QUESTS</div>'+goalList()+'</div><div class="panel"><div class="eyebrow">QUICK LOG</div><textarea id="note" placeholder="What did you do today? One small win…"></textarea><button class="primary" onclick="addLog()">Save today's entry</button></div>'}
else if(current==="Daily Log"||current==="Weekly Review"){v.innerHTML='<div class="panel"><div class="eyebrow">'+current.toUpperCase()+'</div><textarea id="note" placeholder="Wins, progress, lessons, or what to focus on next…"></textarea><button class="primary" onclick="addLog()">Save entry</button></div><div class="panel"><div class="eyebrow">RECENT ENTRIES</div>'+data.logs.slice().reverse().map(x=>'<div class="item"><div><b>'+esc(x.date)+'</b><div class="muted">'+esc(x.text)+'</div></div><button onclick="delLog('+data.logs.indexOf(x)+')">×</button></div>').join('')+'</div>'}
else {v.innerHTML='<div class="panel"><div class="eyebrow">'+current.toUpperCase()+' QUESTS</div><p class="muted">Add a goal for this area. Break it into steps and celebrate progress.</p>'+goalList(current)+' <div class="row"><input id="goal" placeholder="Add a goal…"><button class="primary" onclick="addGoal()">Add</button></div></div><div class="panel"><div class="eyebrow">REFLECTION</div><textarea id="note" placeholder="Notes, ideas, progress…"></textarea><button class="primary" onclick="addLog()">Save entry</button></div>'}
}
function goalList(filter){let a=data.goals.filter(x=>!filter||x.area===filter);return a.length?a.map(x=>'<div class="item"><label><input class="check" type="checkbox" '+(x.done?'checked':'')+' onchange="toggleGoal('+data.goals.indexOf(x)+')"> '+esc(x.text)+'</label><span class="muted">'+esc(x.area)+'</span></div>').join(''):'<p class="muted">No goals yet. Add one below.</p>'}
function addGoal(){let t=goal.value.trim();if(!t)return;data.goals.push({text:t,area:current,done:false});save();render()}
function toggleGoal(i){data.goals[i].done=!data.goals[i].done;save();render()}
function addLog(){let t=note.value.trim();if(!t)return;data.logs.push({date:new Date().toLocaleDateString(),text:t,area:current});save();render()}
function delLog(i){data.logs.splice(i,1);save();render()}
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
