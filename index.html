<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111214">
<meta name="description" content="Side Quest: a personal progress tracker.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
<title>Side Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="app">
<header class="topbar">
<div class="brand"><span class="brand-mark"><i class="sq-icon" data-lucide="shield-check" aria-hidden="true"></i></span>Side Quest <span class="brand-version">v0.8.44</span></div>
<div class="top-actions">
<button class="top-action-btn" id="connectBtn" type="button">Connect</button>
<button class="top-action-btn sync-action-btn" id="syncBtn" type="button" aria-label="Sync now" title="Sync now"><i class="sq-icon" data-lucide="refresh-cw" aria-hidden="true"></i><span>Sync</span></button>
</div>
</header>
<main id="view" aria-live="polite"></main>
</div>
<nav class="bottom-nav" id="bottomNav" aria-label="Main navigation"></nav>
<div class="version-tag" aria-hidden="true">v0.8.44</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="modalRoot"></div>
<script src="https://unpkg.com/lucide@1.71.0" defer></script>
<script src="app.js" defer></script>
</body>
</html>
