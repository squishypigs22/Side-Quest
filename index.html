<style>
:root{color-scheme:dark;--bg:#0b0d0b;--surface:#121512;--surface2:#191e19;--surface3:#20271f;--line:#293128;--text:#f2f5ee;--muted:#929b8e;--lime:#c9f27a;--lime-dark:#1d2812;--red:#ff8f83;--radius:18px;--shadow:0 18px 50px #0004}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 80% -10%,#28331c55,transparent 35%),var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.01em}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
.app{min-height:100vh;display:grid;grid-template-columns:248px minmax(0,1fr);max-width:1440px;margin:auto}.sidebar{height:100vh;position:sticky;top:0;padding:28px 18px 20px;border-right:1px solid var(--line);display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:11px;padding:2px 10px 30px}.brand-mark{width:35px;height:35px;border-radius:12px;background:var(--lime);color:#17200f;display:grid;place-items:center;font-weight:900;font-size:18px;box-shadow:0 0 28px #c9f27a22}.brand-name{font-size:18px;font-weight:750;letter-spacing:-.8px}.brand-name span{color:var(--lime)}.brand-year{font-size:10px;color:var(--muted);letter-spacing:1.8px;text-transform:uppercase}.nav-label{font-size:10px;color:#707a6e;letter-spacing:1.7px;text-transform:uppercase;padding:12px 12px 9px}.nav{display:grid;gap:5px}.nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:var(--muted);padding:11px 12px;border-radius:11px;text-align:left;transition:.16s}.nav button:hover{background:var(--surface2);color:var(--text)}.nav button.active{background:#c9f27a14;color:var(--lime);font-weight:650}.nav-icon{width:20px;text-align:center;font-size:15px}.side-bottom{margin-top:auto}.local-note{padding:13px;border:1px solid var(--line);border-radius:13px;color:var(--muted);font-size:11px;line-height:1.55}.local-note strong{display:block;color:var(--text);font-size:12px;margin-bottom:3px}
main{min-width:0;padding:0 44px 70px;max-width:1200px;width:100%;margin:auto}.topbar{height:82px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff0d;margin-bottom:34px}.crumb{font-size:13px;color:var(--muted)}.crumb strong{color:var(--text);font-weight:600}.top-actions{display:flex;align-items:center;gap:9px}.date-pill{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:30px;padding:8px 12px}.icon-btn{border:1px solid var(--line);background:var(--surface);color:var(--muted);width:36px;height:36px;border-radius:11px}.icon-btn:hover{color:var(--lime);border-color:#64734d}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px}.overline{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--lime);font-weight:700}.page-head h1{font-size:clamp(27px,4vw,38px);letter-spacing:-1.8px;line-height:1.12;margin:7px 0}.page-head p{color:var(--muted);margin:7px 0 0;font-size:14px}.primary{background:var(--lime);color:#17200f;border:0;border-radius:11px;padding:11px 16px;font-weight:750;box-shadow:0 5px 20px #c9f27a17}.primary:hover{background:#d8ff91;transform:translateY(-1px)}.secondary{background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 12px}.secondary:hover{border-color:#62734c}.danger{color:var(--red)!important}.muted{color:var(--muted)}.tiny{font-size:11px}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}.card{background:linear-gradient(145deg,#171c17,#111411);border:1px solid var(--line);border-radius:var(--radius);padding:20px;min-width:0}.stat-label{font-size:11px;color:var(--muted);letter-spacing:.4px}.stat-value{font-size:30px;font-weight:750;letter-spacing:-1.5px;margin:7px 0 0}.stat-foot{font-size:11px;color:var(--muted);margin-top:2px}.layout-two{grid-template-columns:minmax(0,1.45fr) minmax(260px,.85fr);align-items:start}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.section-head h2{font-size:15px;letter-spacing:-.3px;margin:0}.section-head span{font-size:11px;color:var(--muted)}.quest-list{display:grid;gap:8px}.quest{display:flex;align-items:center;gap:12px;padding:12px;background:#ffffff04;border:1px solid #ffffff0a;border-radius:12px}.quest-check{appearance:none;width:19px;height:19px;border:1px solid #596351;border-radius:6px;background:transparent;flex:0 0 auto;position:relative;cursor:pointer}.quest-check:checked{background:var(--lime);border-color:var(--lime)}.quest-check:checked:after{content:"✓";position:absolute;inset:-1px;color:#18200f;font-size:14px;font-weight:900;text-align:center}.quest-copy{min-width:0;flex:1}.quest-title{font-size:13px;font-weight:600;overflow-wrap:anywhere}.quest.done .quest-title{text-decoration:line-through;color:var(--muted)}.quest-meta{font-size:10px;color:var(--muted);margin-top:2px}.quest-delete{border:0;background:none;color:#65705f;font-size:17px;padding:2px 5px}.quest-delete:hover{color:var(--red)}.empty{padding:20px 12px;text-align:center;color:var(--muted);font-size:12px;border:1px dashed var(--line);border-radius:12px}
.progress-track{height:7px;background:#30382d;border-radius:20px;overflow:hidden}.progress-fill{height:100%;background:var(--lime);border-radius:20px;transition:width .25s}.progress-row{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin:12px 0 7px}.quick-form{display:grid;gap:10px}.field{width:100%;background:#0d100d;border:1px solid var(--line);border-radius:11px;padding:12px 13px;color:var(--text);resize:vertical}.field::placeholder{color:#697365}.field:focus{border-color:#7e9859;outline:none}.form-row{display:flex;gap:9px}.form-row>*{min-width:0}.form-row .field{flex:1}.goal-form{display:flex;gap:8px;margin-top:14px}.goal-form .field{flex:1}.log-list{display:grid;gap:9px}.log-entry{padding:14px;border:1px solid #ffffff0d;background:#ffffff04;border-radius:12px}.log-top{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--muted);margin-bottom:5px}.log-text{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}.category-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.category-card{padding:18px;border:1px solid var(--line);border-radius:15px;background:var(--surface);text-align:left;color:var(--text);width:100%}.category-card:hover{border-color:#697d4d;transform:translateY(-2px)}.category-top{display:flex;align-items:center;justify-content:space-between}.category-symbol{font-size:18px}.category-count{font-size:11px;color:var(--muted)}.category-card h3{font-size:15px;margin:13px 0 4px}.category-card p{font-size:11px;color:var(--muted);margin:0 0 13px}.review-box{min-height:135px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.file-input{display:none}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--lime);color:#17200f;font-size:12px;font-weight:700;padding:10px 15px;border-radius:30px;transition:.2s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}footer{color:#65705f;font-size:10px;text-align:center;padding:36px 0 12px}
.mobile-brand{display:none}
@media(max-width:900px){.app{grid-template-columns:205px minmax(0,1fr)}main{padding:0 25px 60px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.layout-two{grid-template-columns:1fr}}
@media(max-width:650px){.app{display:block}.sidebar{display:none}main{padding:0 17px calc(90px + env(safe-area-inset-bottom));}.topbar{height:62px;margin-bottom:25px}.mobile-brand{display:flex;align-items:center;gap:8px;font-weight:750}.mobile-brand .brand-mark{width:29px;height:29px;border-radius:9px;font-size:15px}.date-pill{font-size:10px;padding:7px 9px}.page-head{align-items:flex-start;flex-direction:column;margin-bottom:19px;gap:12px}.page-head .primary{width:100%}.stats{gap:9px}.card{padding:16px;border-radius:15px}.stat-value{font-size:26px}.category-grid{gap:9px}.category-card{padding:14px}.bottom-nav{position:fixed;z-index:10;bottom:0;left:0;right:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#101310f2;border-top:1px solid var(--line);backdrop-filter:blur(18px);display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.bottom-nav button{border:0;background:transparent;color:var(--muted);padding:6px 2px;border-radius:9px;display:grid;justify-items:center;gap:2px;font-size:9px}.bottom-nav button span:first-child{font-size:16px}.bottom-nav button.active{color:var(--lime);background:#c9f27a12}.form-row{flex-direction:column}.goal-form{align-items:stretch}.goal-form .primary{padding:10px 13px}}
@media(min-width:651px){.bottom-nav{display:none}}
</style>

<body>
<div class="app">
<aside class="sidebar">
<div class="brand"><div class="brand-mark">↗</div><div><div class="brand-name">Side <span>Quest.</span></div><div class="brand-year">YOUR 2027</div></div></div>
<div class="nav-label">Workspace</div><nav class="nav" id="sideNav"></nav>

</aside>
<main>
<div class="topbar"><div class="mobile-brand"><div class="brand-mark">↗</div>Side Quest<span style="color:var(--lime)">.</span></div><div class="crumb" id="crumb">Workspace / <strong>Overview</strong></div><div class="top-actions"><div class="date-pill" id="today"></div><button class="icon-btn" id="exportBtn" title="Export backup" aria-label="Export backup">↓</button><button class="icon-btn" id="importBtn" title="Import backup" aria-label="Import backup">↑</button><input class="file-input" id="importFile" type="file" accept="application/json"></div></div>
<div id="view" aria-live="polite"><section class="card"><h1>Side Quest</h1><p class="muted">Loading your dashboard…</p></section></div>
<script>
window.addEventListener("error",function(event){
 const view=document.getElementById("view");
 if(view)view.innerHTML='<section class="card"><h1>Side Quest couldn’t start</h1><p class="muted">A script error stopped the dashboard loading.</p><p style="color:var(--red);overflow-wrap:anywhere;font-size:12px">'+String(event.message||"Unknown error").replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})+'</p></section>';
});

<footer>Built for progress, not perfection · Your data stays on this device</footer>

</div>

<script>
(function(){
const areas=[
{name:"Music",icon:"♫",desc:"Write, practise and record your music."},
{name:"Skate",icon:"⌁",desc:"Build confidence, consistency and new skills."},
{name:"Wellbeing",icon:"✳",desc:"Make space for rest and good routines."},
{name:"College",icon:"▤",desc:"Stay on top of learning and assignments."},
{name:"Work & Money",icon:"↗",desc:"Explore work and build savings."}
];
const pages=[{name:"Overview",icon:"⌂"},{name:"Daily Log",icon:"＋"},...areas.map(a=>({name:a.name,icon:a.icon})),{name:"Weekly Review",icon:"◷"}];
const descriptions={"Daily Log":"Capture the small wins and the work behind them.","Weekly Review":"Step back, notice what moved forward and choose your next focus."};
let current="Overview";
let data;
try{data=JSON.parse(localStorage.getItem("sq27")||'{"logs":[],"goals":[]}')}catch(e){data={logs:[],goals:[]}}
if(!data||typeof data!=="object")data={logs:[],goals:[]};
if(!Array.isArray(data.logs))data.logs=[];
if(!Array.isArray(data.goals))data.goals=[];
data.goals=data.goals.map(g=>({text:String(g.text||""),area:areas.some(a=>a.name===g.area)?g.area:"Music",done:!!g.done}));
data.logs=data.logs.map(l=>({date:String(l.date||""),text:String(l.text||""),area:String(l.area||"Daily Log")}));
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const save=()=>{localStorage.setItem("sq27",JSON.stringify(data));};
function parseDate(value){if(/^\\d{4}-\\d{2}-\\d{2}$/.test(value))return new Date(value+"T12:00:00");const m=value.match(/^(\\d{1,2})\\/(\\d{1,2})\\/(\\d{4})$/);if(m)return new Date(Number(m[3]),Number(m[2])-1,Number(m[1]),12);return new Date(value);}
function localDateKey(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function dateLabel(value){const d=parseDate(value);return isNaN(d)?value:d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});}
const weekLogs=()=>data.logs.filter(l=>{const d=parseDate(l.date);return !isNaN(d)&&Date.now()-d.getTime()<7*86400000&&Date.now()>=d.getTime()-86400000});
const completed=()=>data.goals.filter(g=>g.done).length;
function nav(){const make=(mobile)=>pages.map(p=>'<button data-page="'+esc(p.name)+'" class="'+(current===p.name?'active':'')+'"><span class="'+(mobile?'':'nav-icon')+'">'+p.icon+'</span>'+(mobile?'<span>'+esc(p.name==="Overview"?"Home":p.name==="Daily Log"?"Log":p.name==="Weekly Review"?"Review":p.name)+'</span>':esc(p.name))+'</button>').join("");$("sideNav").innerHTML=make(false);$("mobileNav").innerHTML=pages.filter(p=>["Overview","Daily Log","Music","Skate","Weekly Review"].includes(p.name)).map(p=>'<button data-page="'+esc(p.name)+'" class="'+(current===p.name?'active':'')+'"><span>'+p.icon+'</span><span>'+esc(p.name==="Overview"?"Home":p.name==="Daily Log"?"Log":p.name==="Weekly Review"?"Review":p.name)+'</span></button>').join("");}
function goalRows(filter){const list=data.goals.map((g,i)=>({g,i})).filter(x=>!filter||x.g.area===filter);if(!list.length)return '<div class="empty">Nothing here yet. Add your first quest below.</div>';return '<div class="quest-list">'+list.map(x=>'<div class="quest '+(x.g.done?'done':'')+'"><input class="quest-check" type="checkbox" data-toggle="'+x.i+'" '+(x.g.done?'checked':'')+' aria-label="Mark '+esc(x.g.text)+' complete"><div class="quest-copy"><div class="quest-title">'+esc(x.g.text)+'</div><div class="quest-meta">'+esc(x.g.area)+'</div></div><button class="quest-delete" data-delete-goal="'+x.i+'" aria-label="Delete goal">×</button></div>').join("")+'</div>';}
function logsMarkup(filter){const list=data.logs.map((l,i)=>({l,i})).filter(x=>!filter||x.l.area===filter).slice().reverse();if(!list.length)return '<div class="empty">Your entries will appear here.</div>';return '<div class="log-list">'+list.map(x=>'<article class="log-entry"><div class="log-top"><span>'+esc(dateLabel(x.l.date))+' · '+esc(x.l.area)+'</span><button class="quest-delete" data-delete-log="'+x.i+'" aria-label="Delete entry">×</button></div><div class="log-text">'+esc(x.l.text)+'</div></article>').join("")+'</div>';}
function progressBar(done,total){const pct=total?Math.round(done/total*100):0;return '<div class="progress-row"><span>Quest progress</span><strong>'+pct+'%</strong></div><div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div>';}
function logForm(label,placeholder,area){return '<form class="quick-form" data-log-form="'+esc(area)+'"><textarea class="field" name="text" rows="3" placeholder="'+esc(placeholder)+'" required></textarea><div style="display:flex;justify-content:flex-end"><button class="primary" type="submit">'+esc(label)+' ↗</button></div></form>';}
function overview(){const week=weekLogs(),done=completed(),total=data.goals.length,pct=total?Math.round(done/total*100):0;return '<div class="page-head"><div><div class="overline">Your year, in progress</div><h1>Make it count.</h1><p>One day at a time. Keep showing up.</p></div><button class="primary" data-page="Daily Log">＋ Log today</button></div><div class="grid stats"><div class="card"><div class="stat-label">QUESTS COMPLETED</div><div class="stat-value">'+done+'<span class="muted" style="font-size:16px"> / '+total+'</span></div><div class="stat-foot">Keep building momentum</div></div><div class="card"><div class="stat-label">ENTRIES THIS WEEK</div><div class="stat-value">'+week.length+'</div><div class="stat-foot">Your week in moments</div></div><div class="card"><div class="stat-label">TOTAL ENTRIES</div><div class="stat-value">'+data.logs.length+'</div><div class="stat-foot">Every step counts</div></div><div class="card"><div class="stat-label">YEARLY QUEST PROGRESS</div><div class="stat-value">'+pct+'%</div><div class="stat-foot">Across all your goals</div></div></div><div class="grid layout-two"><section class="card"><div class="section-head"><h2>Your quests</h2><span>'+done+' of '+total+' complete</span></div>'+progressBar(done,total)+goalRows()+'<div style="margin-top:15px"><button class="secondary" data-page="Music">Manage your goals →</button></div></section><section class="grid"><div class="card"><div class="section-head"><h2>Quick capture</h2><span>Today</span></div>'+logForm("Save entry","What moved forward today?","Daily Log")+'</div><div class="card"><div class="section-head"><h2>Your focus areas</h2><span>2027</span></div><div class="grid category-grid">'+areas.map(a=>'<button class="category-card" data-page="'+esc(a.name)+'"><div class="category-top"><span class="category-symbol">'+a.icon+'</span><span class="category-count">'+data.goals.filter(g=>g.area===a.name&&g.done).length+'/'+data.goals.filter(g=>g.area===a.name).length+'</span></div><h3>'+esc(a.name)+'</h3><p>'+esc(a.desc)+'</p>'+progressBar(data.goals.filter(g=>g.area===a.name&&g.done).length,data.goals.filter(g=>g.area===a.name).length)+'</button>').join("")+'</div></div></section></div><section class="card" style="margin-top:15px"><div class="section-head"><h2>Recent activity</h2><button class="secondary" data-page="Daily Log">View all →</button></div>'+logsMarkup().replace('class="log-list"','class="log-list"')+'</section>';}
function areaPage(name){const a=areas.find(x=>x.name===name);const gs=data.goals.filter(g=>g.area===name),done=gs.filter(g=>g.done).length;return '<div class="page-head"><div><div class="overline">Focus area</div><h1>'+a.icon+' '+esc(name)+'</h1><p>'+esc(a.desc)+'</p></div></div><div class="grid layout-two"><section class="card"><div class="section-head"><h2>Your quests</h2><span>'+done+'/'+gs.length+' complete</span></div>'+progressBar(done,gs.length)+goalRows(name)+'<form class="goal-form" id="goalForm"><input class="field" name="goal" placeholder="Add a goal or milestone…" maxlength="120" required><button class="primary" type="submit">Add quest</button></form></section><section class="grid"><div class="card"><div class="section-head"><h2>Reflect</h2><span>Quick note</span></div>'+logForm("Save note","Ideas, progress, next steps…",name)+'</div><div class="card"><div class="section-head"><h2>Recent notes</h2></div>'+logsMarkup(name)+'</div></section></div>';}
function daily(){return '<div class="page-head"><div><div class="overline">Keep a record</div><h1>Daily log.</h1><p>'+descriptions["Daily Log"]+'</p></div></div><div class="grid layout-two"><section class="card"><div class="section-head"><h2>New entry</h2><span>'+new Date().toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"})+'</span></div>'+logForm("Save entry","What did you work on? What went well? What did you learn?","Daily Log")+'</section><section class="card"><div class="section-head"><h2>At a glance</h2></div><div class="stat-value">'+weekLogs().length+'</div><div class="muted tiny">Entries in the last seven days</div><div style="margin-top:15px">'+progressBar(Math.min(weekLogs().length,7),7)+'</div></section></div><section class="card" style="margin-top:15px"><div class="section-head"><h2>All entries</h2><span>'+data.logs.length+' total</span></div>'+logsMarkup()+'</section>';}
function review(){const week=weekLogs();return '<div class="page-head"><div><div class="overline">Pause & reflect</div><h1>Weekly review.</h1><p>'+descriptions["Weekly Review"]+'</p></div></div><div class="grid stats"><div class="card"><div class="stat-label">THIS WEEK</div><div class="stat-value">'+week.length+'</div><div class="stat-foot">Entries recorded</div></div><div class="card"><div class="stat-label">QUESTS DONE</div><div class="stat-value">'+completed()+'</div><div class="stat-foot">Across your year</div></div><div class="card"><div class="stat-label">OPEN QUESTS</div><div class="stat-value">'+(data.goals.length-completed())+'</div><div class="stat-foot">Still in progress</div></div><div class="card"><div class="stat-label">TOTAL ENTRIES</div><div class="stat-value">'+data.logs.length+'</div><div class="stat-foot">Your progress so far</div></div></div><section class="card"><div class="section-head"><h2>Weekly reflection</h2><span>Take five minutes</span></div>'+logForm("Save weekly review","What went well this week?\nWhat challenged you?\nWhat is one thing to focus on next week?","Weekly Review")+'</section><section class="card" style="margin-top:15px"><div class="section-head"><h2>This week's entries</h2><span>'+week.length+' entries</span></div>'+logsMarkup("Daily Log")+'</section>';}
function render(){nav();$("crumb").innerHTML='Workspace / <strong>'+esc(current)+'</strong>';$("today").textContent=new Date().toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});let html=current==="Overview"?overview():current==="Daily Log"?daily():current==="Weekly Review"?review():areaPage(current);$("view").innerHTML=html;}
function notify(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2100);}
document.addEventListener("click",e=>{const p=e.target.closest("[data-page]");if(p){current=p.dataset.page;render();window.scrollTo({top:0,behavior:"smooth"});return;}const tg=e.target.closest("[data-toggle]");if(tg){const i=Number(tg.dataset.toggle);if(data.goals[i]){data.goals[i].done=tg.checked;save();render();}return;}const dg=e.target.closest("[data-delete-goal]");if(dg){const i=Number(dg.dataset.deleteGoal);if(data.goals[i]&&confirm("Delete this quest?")){data.goals.splice(i,1);save();render();}return;}const dl=e.target.closest("[data-delete-log]");if(dl){const i=Number(dl.dataset.deleteLog);if(data.logs[i]&&confirm("Delete this entry?")){data.logs.splice(i,1);save();render();}}});
document.addEventListener("submit",e=>{if(e.target.matches("[data-log-form]")){e.preventDefault();const text=e.target.elements.text.value.trim();if(!text)return;data.logs.push({date:localDateKey(),text,area:e.target.dataset.logForm});save();render();notify("Entry saved");}if(e.target.id==="goalForm"){e.preventDefault();const text=e.target.elements.goal.value.trim();if(!text)return;data.goals.push({text,area:current,done:false});save();render();notify("Quest added");}});
$("exportBtn").addEventListener("click",()=>{const blob=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),data},null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="side-quest-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();URL.revokeObjectURL(url);notify("Backup exported");});
$("importBtn").addEventListener("click",()=>$("importFile").click());
$("importFile").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;try{const parsed=JSON.parse(await f.text());const incoming=parsed.data||parsed;if(!Array.isArray(incoming.goals)||!Array.isArray(incoming.logs))throw new Error("Invalid backup");if(!confirm("Import this backup and replace the data on this device?"))return;data=incoming;save();render();notify("Backup restored");}catch(err){alert("That file doesn't look like a valid Side Quest backup.");}e.target.value="";});
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{});
})();
</script>
</body>
