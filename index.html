<header class="topbar"><div class="brand"><div class="brand-mark">✦</div>Side <span>Quest</span></div><div class="top-actions"><button class="icon-btn" id="exportBtn" title="Export backup" aria-label="Export backup">↓</button><button class="icon-btn" id="importBtn" title="Import backup" aria-label="Import backup">↑</button><input class="file-input" id="importFile" type="file" accept="application/json"></div></header>

<script>
(function(){
const A=[{id:"skate",name:"Skating",icon:"🛹",color:"#ff6b6b"},{id:"drums",name:"Drums",icon:"🥁",color:"#ffb84d"},{id:"guitar",name:"Guitar",icon:"🎸",color:"#a78bfa"},{id:"workout",name:"Workouts",icon:"⚡",color:"#4dd6c8"}];
const T=["Ollie","Fakie Ollie","Nollie","Switch Ollie","Shuvit","Pop Shuvit","Fakie Shuvit","Frontside 180","Backside 180","Fakie 180","Nollie 180","Kickflip","Heelflip","Fakie Kickflip","Fakie Heelflip","Varial Kickflip","Varial Heelflip","Hardflip","Inward Heelflip","Frontside Pop Shuvit","Backside Pop Shuvit","Bigspin","360 Shuvit","Fakie Bigspin","Frontside Bigspin","Backside Bigspin","Tre Flip","Laser Flip","360 Flip","Fakie 360 Flip","Nollie Kickflip","Nollie Heelflip","Switch Kickflip","Switch Heelflip","Frontside Flip","Backside Flip","Half Cab","Half Cab Flip","Half Cab Heelflip","No Comply","Boneless","Manual","Nose Manual","Boardslide","50-50 Grind","5-0 Grind","Smith Grind","Feeble Grind","Crooked Grind","Nosegrind"];
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let data;try{data=JSON.parse(localStorage.getItem("sq27")||"{}")}catch(e){data={}}if(!data||typeof data!=="object")data={};data.activityDays=data.activityDays||{};data.tricks=data.tricks||{};
let page="Overview",activity="skate",year=new Date().getFullYear();
const save=()=>localStorage.setItem("sq27",JSON.stringify(data)),dk=(y,m,d)=>y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0"),status=(id,date)=>data.activityDays[id]?.[date]??0,count=id=>Object.values(data.activityDays[id]||{}).filter(v=>v===1).length,state=t=>data.tricks[t]||"Not learnt";
function nav(){let it=[["Overview","⌂"],["Activities","▦"],["Skate tricks","✦"]];$("mobileNav").innerHTML=it.map(([n,i])=>'<button data-page="'+n+'" class="'+(page===n?"active":"")+'"><span>'+i+'</span><span>'+n+'</span></button>').join("")}
function head(k,t,s){return '<div class="page-head"><div><div class="overline">'+k+'</div><h1>'+t+'</h1><p>'+s+'</p></div></div>'}
function month(id,y,m){let f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),c="";for(let i=0;i<f;i++)c+='<span class="day-blank"></span>';for(let d=1;d<=n;d++){let k=dk(y,m,d),v=status(id,k),future=new Date(y,m,d)>new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate());c+='<button class="day-dot '+(v===1?"done":v===-1?"missed":"")+'" data-day="'+k+'" data-activity="'+id+'" '+(future?"disabled":"")+' title="'+k+'">'+d+'</button>'}return '<section class="month"><div class="month-name">'+new Date(y,m,1).toLocaleDateString(undefined,{month:"long"})+'</div><div class="weekdays"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div><div class="days-grid">'+c+'</div></section>'}
function cal(id){let a=A.find(x=>x.id===id);return '<div class="calendar-wrap"><div class="calendar-top"><div class="activity-title"><span>'+a.icon+'</span><h2>'+a.name+'</h2><p>Tap a day: green = done, red = not done, blank = not logged.</p></div><div class="year-switch"><button class="secondary" data-year="-1">‹</button><b>'+year+'</b><button class="secondary" data-year="1">›</button></div></div><div class="months-grid">'+Array.from({length:12},(_,m)=>month(id,year,m)).join("")+'</div></div>'}
function activities(){return head("SHOW UP OFTEN","Activity map.","A visual record of the days you got it done.")+'<div class="activity-tabs">'+A.map(a=>'<button data-tab="'+a.id+'" class="'+(activity===a.id?"active":"")+'" style="--activity:'+a.color+'"><span>'+a.icon+'</span>'+a.name+' <b>'+count(a.id)+'</b></button>').join("")+'</div>'+cal(activity)}
function home(){let d=T.filter(t=>state(t)==="Learnt").length,l=T.filter(t=>state(t)==="Learning").length;return head("YOUR YEAR, YOUR PACE","Make it happen.","Less writing. More doing.")+'<div class="overview-hero"><div><span class="hero-tag">SIDE QUEST / 2027</span><h2>Small sessions.<br><em>Big progress.</em></h2><p>Track the days you showed up, and watch your skills grow.</p><button class="primary" data-page="Activities">Log an activity ↗</button></div><div class="hero-orbit"><span>✦</span><b>2027</b><small>YOUR YEAR</small></div></div><div class="overview-stats">'+A.map(a=>'<button class="activity-stat" data-open="'+a.id+'" style="--activity:'+a.color+'"><span>'+a.icon+'</span><strong>'+count(a.id)+'</strong><small>'+a.name+' · days logged</small></button>').join("")+'</div><div class="grid layout-two"><section class="card"><div class="section-head"><h2>Skate trick progress</h2><span>'+d+'/50 learnt</span></div><div class="trick-big">'+d+'<small> / 50</small></div><div class="trick-track"><i style="width:'+(d/50*100)+'%"></i></div><div class="trick-breakdown"><span>'+l+' learning</span><span>'+(50-d-l)+' not learnt</span></div><button class="secondary" data-page="Skate tricks">View trick list →</button></section><section class="card"><div class="section-head"><h2>Log today</h2><span>Quick tap</span></div><div class="quick-activities">'+A.map(a=>'<button data-quick="'+a.id+'"><span>'+a.icon+'</span>'+a.name+' <b>+</b></button>').join("")+'</div><p class="tiny muted">Tap once to mark today as done.</p></section></div>'}
function trickPage(){let n=T.filter(t=>state(t)==="Not learnt").length,l=T.filter(t=>state(t)==="Learning").length,d=50-n-l;return head("SKATEBOARDING","Trick list.","50 tricks to work through. Change each one as you progress.")+'<div class="trick-summary-bar"><div><strong>'+d+'</strong><span>Learnt</span></div><div><strong>'+l+'</strong><span>Learning</span></div><div><strong>'+n+'</strong><span>Not learnt</span></div><div><strong>50</strong><span>Total</span></div></div><div class="trick-list">'+T.map((t,i)=>'<div class="trick-row"><span class="trick-number">'+String(i+1).padStart(2,"0")+'</span><strong>'+esc(t)+'</strong><select data-trick="'+esc(t)+'" class="trick-select '+state(t).toLowerCase().replace(" ","-")+'"><option '+(state(t)==="Not learnt"?"selected":"")+'>Not learnt</option><option '+(state(t)==="Learning"?"selected":"")+'>Learning</option><option '+(state(t)==="Learnt"?"selected":"")+'>Learnt</option></select></div>').join("")+'</div>'}
function render(){nav();$("view").innerHTML=page==="Overview"?home():page==="Activities"?activities():trickPage()}
function toast(s){let t=$("toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500)}
document.addEventListener("click",e=>{let p=e.target.closest("[data-page]");if(p){page=p.dataset.page;render();window.scrollTo(0,0);return}let t=e.target.closest("[data-tab]");if(t){activity=t.dataset.tab;render();return}let o=e.target.closest("[data-open]");if(o){activity=o.dataset.open;page="Activities";render();return}let q=e.target.closest("[data-quick]");if(q){let d=new Date(),k=dk(d.getFullYear(),d.getMonth(),d.getDate()),id=q.dataset.quick;data.activityDays[id]=data.activityDays[id]||{};data.activityDays[id][k]=1;save();render();toast("Today logged");return}let day=e.target.closest("[data-day]");if(day&&!day.disabled){let id=day.dataset.activity,k=day.dataset.day;data.activityDays[id]=data.activityDays[id]||{};let v=status(id,k);data.activityDays[id][k]=v===0?1:v===1?-1:0;save();render();return}let y=e.target.closest("[data-year]");if(y){year+=Number(y.dataset.year);render()}});
document.addEventListener("change",e=>{let s=e.target.closest("[data-trick]");if(s){data.tricks[s.dataset.trick]=s.value;save();render()}});
$("exportBtn").addEventListener("click",()=>{let b=new Blob([JSON.stringify({version:2,data},null,2)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="side-quest-backup.json";a.click();URL.revokeObjectURL(u);toast("Backup exported")});
$("importBtn").addEventListener("click",()=>$("importFile").click());
$("importFile").addEventListener("change",async e=>{let f=e.target.files[0];if(!f)return;try{let p=JSON.parse(await f.text()),v=p.data||p;if(!v||typeof v!=="object")throw 0;if(!confirm("Restore this backup and replace current progress?"))return;data={activityDays:v.activityDays||{},tricks:v.tricks||{}};save();render();toast("Backup restored")}catch(x){alert("That file doesn't look like a valid Side Quest backup.")}e.target.value=""});
render();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{});
})();</script>
</body>
